[package]
name = "arcbox-helper"
description = "Privileged helper daemon for host mutations (routes, DNS, sockets)"
# Independent of workspace.package.version. Bump only when the on-disk
# privileged binary must be replaced (RPC wire break, security fix in the
# root helper, or behavior the current daemon hard-requires). Ordinary runtime
# bumps must NOT change this, or every Desktop user gets an admin-password
# reinstall prompt.
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "arcbox_helper"
path = "src/lib.rs"

[[bin]]
name = "arcbox-helper"
path = "src/main.rs"

[dependencies]
tarpc = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
arcbox-constants.workspace = true
arcbox-logging.workspace = true
arcbox-route = { workspace = true }
tracing = { workspace = true }
tokio-util = "0.7"
ipnetwork = "0.21.1"
# Native code-signing peer authentication and CA trust need no ALPN feature.
security-framework = { version = "3.7", default-features = false }
core-foundation = "0.10"
arcbox-local-ca = { version = "0.8.2", path = "../../common/arcbox-local-ca" }
security-framework-sys = "2.17.0"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
