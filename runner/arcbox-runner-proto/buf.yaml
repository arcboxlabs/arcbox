# Provenance for the vendored proto under proto/. Not a build dependency:
# the crate compiles the vendored file with tonic-build. Refresh the vendored
# copy from the registry with `make runner-proto-sync`
# (buf export buf.build/arcboxlabs/runner -o proto).
version: v2
modules:
  # Module root is proto/ so file paths (arcbox/runner/v1/…) match the
  # declared package name for buf lint's PACKAGE_DIRECTORY_MATCH rule.
  - path: proto
deps:
  - buf.build/arcboxlabs/runner
