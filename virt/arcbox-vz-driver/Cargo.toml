[package]
name              = "arcbox-vz-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "The Virtualization.framework adapter for the arcbox-vm-driver port: renders a VmSpec into a VZ configuration, runs the VM in-process, and serves vsock, console, balloon and port forwarding over it."

[dependencies]
arcbox-vm-driver.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arcbox-net.workspace = true
arcbox-vmnet.workspace = true
arcbox-vz.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio-util = "0.7"

[dev-dependencies]
arcbox-vm-driver = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
vmnet = ["arcbox-net/vmnet", "arcbox-vmnet/vmnet"]

[lints]
workspace = true
