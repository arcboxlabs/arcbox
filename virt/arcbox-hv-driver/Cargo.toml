[package]
name              = "arcbox-hv-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "The Hypervisor.framework adapter for the arcbox-vm-driver port: one arcbox-hv-vmm process per VM, controlled over a Unix socket, with checkpoint, prepare and adopt."

[[bin]]
name = "arcbox-hv-vmm"
path = "src/main.rs"

[dependencies]
arcbox-vm-driver.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arcbox-fakeip.workspace = true
arcbox-vmm.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["uio"] }
tracing-subscriber.workspace = true

[dev-dependencies]
arcbox-vm-driver = { workspace = true, features = ["testkit"] }
tempfile.workspace = true

[lints]
workspace = true
