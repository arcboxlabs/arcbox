[package]
name = "arcbox-image"
description = "Boot-asset and machine-image management for ArcBox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
arcbox-asset = { workspace = true }
arcbox-boot = { workspace = true }
arcbox-constants = { workspace = true }
arcbox-error = { workspace = true }
dirs = { workspace = true }
flate2 = "1.1.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = "0.4.46"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"
